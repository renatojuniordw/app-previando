name: E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://previando:previando@localhost:5432/previando_e2e
  REDIS_URL: redis://localhost:6379
  NEXTAUTH_SECRET: e2e-secret-not-used-in-tests
  NEXTAUTH_URL: http://localhost:60002
  CPF_HASH_SALT: e2e-test-salt-do-not-use-in-production
  SALARIO_MINIMO_API: http://localhost:9999

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: previando
          POSTGRES_PASSWORD: previando
          POSTGRES_DB: previando_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app-previando/package-lock.json
      - run: npm ci
        working-directory: app-previando
      - run: npx prisma generate
        working-directory: app-previando
      - run: npx prisma migrate deploy
        working-directory: app-previando
      - run: npx prisma db seed
        working-directory: app-previando
      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: app-previando
      - name: Run E2E tests
        run: npx playwright test
        working-directory: app-previando
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app-previando/playwright-report/
          retention-days: 7
